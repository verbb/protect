name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} on ${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            lane: current
            craft: ''
          - php: '8.2'
            lane: minimum
            craft: '5.10.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip
          tools: composer:v2
          coverage: none
      - name: Pin the minimum Craft version
        if: matrix.craft != ''
        # The floor itself has advisories fixed in later releases, which only this test run tolerates.
        run: |
          composer config audit.block-insecure false
          composer require --no-update --no-interaction "craftcms/cms:${{ matrix.craft }}"
      - run: composer update --no-interaction --no-progress
      - run: ./vendor/bin/pest
  browser:
    name: Browser package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
